     ZCnova BGM Studio — Blogger 貼り付け用（この1枚で完結します）
     ------------------------------------------------------------
     入れ方
       1. Blogger の投稿画面をひらく
       2. 左上の「作成」を「HTMLビュー」に切り替える
       3. このファイルの中身をぜんぶ貼り付ける
       4. そのまま公開する
     ⚠️ 貼ったあとで「作成（Compose）ビュー」に戻さないでください。
        戻すとタグが書き換えられて動かなくなります。
     ⚠️ 大きいので、投稿が重いと感じるときは下の「外部ファイル版」を
        お使いください（本体をどこかに置いて、数行だけ貼る形です）。
     ============================================================ -->
<div class="zcnova-embed" style="margin:0 0 1.2em;">
  <iframe id="zcnova-frame" title="ZCnova BGM Studio"
          allow="autoplay; clipboard-write"
          loading="lazy"
          style="width:100%;height:1400px;border:0;display:block;background:#14100c;border-radius:10px;"></iframe>
  <noscript><p>この道具を使うには JavaScript を有効にしてください。</p></noscript>
</div>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZCnova BGM Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" onerror="this.remove()"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#14100c; --bg-2:#1c1712; --card:#201a14;
  --wood:#3e2a1d; --wood-hi:#6b4a32; --wood-lo:#2a1c12;
  --brass:#c8963e; --brass-dim:#8a6b3a; --teal:#4fb0a8;
  --text:#ede6d6; --text-dim:#a89a84;
  --border:rgba(200,150,62,0.16); --accent:#d85a30;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
body{
  background-image:
    radial-gradient(ellipse at 50% -10%, rgba(200,150,62,0.08), transparent 60%),
    repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  padding:28px 16px 70px;
}
.wrap{ max-width:1080px; margin:0 auto; }
header{ margin-bottom:16px; }
h1{ font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; letter-spacing:2px; text-transform:uppercase; }
h1 span{ color:var(--brass); }
.subtitle{ font-size:12px; color:var(--text-dim); margin-top:2px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:16px 16px 18px; margin-bottom:16px; }
.card-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
.card-title{ font-family:'Oswald',sans-serif; font-size:14px; font-weight:600; letter-spacing:0.8px;
  text-transform:uppercase; color:var(--brass); display:flex; align-items:center; gap:8px; }
.card-title small{ color:var(--text-dim); font-weight:400; text-transform:none; letter-spacing:0; }
.stage-no{ display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  border-radius:50%; background:var(--brass); color:#14100c; font-size:11px; font-weight:700; }
button{ font-family:inherit; }
.pat-btns{ display:flex; gap:6px; flex-wrap:wrap; }
.pat-btn{ min-width:38px; padding:7px 12px; border-radius:8px; cursor:pointer; font-size:12px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); color:var(--text); }
.pat-btn:hover{ border-color:var(--brass); }
.pat-btn.active{ background:var(--brass); border-color:var(--brass); color:#14100c; font-weight:700;
  box-shadow:0 0 0 2px rgba(200,150,62,0.28); }
.io-btn{ padding:6px 11px; border-radius:7px; cursor:pointer; font-size:11.5px; font-family:inherit;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); color:var(--text); }
.io-btn:hover{ border-color:var(--brass); color:var(--brass); }
.io-btn.go{ background:var(--teal); border-color:var(--teal); color:#14100c; font-weight:700; }
.io-btn.danger{ color:var(--accent); border-color:rgba(216,90,48,0.5); }
.io-btn:disabled{ opacity:0.4; cursor:not-allowed; }
.clr-btn{ padding:5px 10px; border-radius:7px; cursor:pointer; font-size:11px; font-family:inherit;
  background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.16); color:var(--text-dim); }
.clr-btn:hover{ border-color:var(--accent); color:var(--accent); }
.fx-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.fx-row .t-label{ width:110px; flex-shrink:0; font-size:11px; color:var(--text-dim);
  letter-spacing:0.5px; text-align:right; }
.fx-val{ font-size:11.5px; color:var(--brass); min-width:60px; }
.hint{ font-size:11px; color:var(--text-dim); margin-top:8px; line-height:1.7; }
.hint b{ color:var(--brass); }
input[type=range]{ accent-color:var(--brass); width:140px; }
input[type=text]{ background:#1d1710; border:1px solid #4a3d2a; color:var(--text); border-radius:6px;
  padding:5px 8px; font-size:12.5px; font-family:inherit; }
.badge{ display:inline-block; background:rgba(255,255,255,0.05); border:1px solid var(--border);
  border-radius:6px; padding:2px 9px; font-size:11px; color:var(--text-dim); }
.save-mark{ font-size:11px; color:var(--teal); opacity:0; transition:opacity .35s;
  white-space:nowrap; min-width:6.5em; }
.status{ font-size:11.5px; color:var(--text-dim); min-height:1.5em; margin-top:8px; }
.status.warn{ color:var(--accent); }
.status.ok{ color:var(--teal); }
.transport{ background:var(--card); border:1px solid var(--border); border-radius:12px;
  padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
#playBtn{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; background:var(--brass); color:#14100c; border:none; font-size:16px; cursor:pointer; }
#playBtn:hover{ background:#dba84f; }
#renderBtn{ border-color:rgba(216,90,48,0.5); color:var(--accent); }
.io-btn.save{ border-color:rgba(214,168,79,0.65); color:var(--brass); font-weight:600; }
.io-btn.save:hover{ background:rgba(214,168,79,0.14); }
#renderBtn.working{ background:var(--accent); color:#fff; }
.now{ flex:1; min-width:260px; font-size:12px; line-height:1.6; }
.now b{ color:var(--brass); }
.trk{ border:1px solid var(--border); border-radius:10px; margin-bottom:10px; background:var(--bg-2); }
.trk.trk-off{ opacity:0.55; border-style:dashed; }
.trk.trk-off .trk-name::after{ content:'（いまは鳴りません）'; color:var(--accent); font-size:10px; margin-left:6px; }
.trk-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:9px 12px; cursor:pointer; }
.trk.open .trk-head{ border-bottom:1px solid var(--border); }
.trk-name{ font-family:'Oswald',sans-serif; font-size:12.5px; letter-spacing:0.6px;
  color:var(--brass); min-width:88px; }
.trk-name small{ color:var(--text-dim); font-family:'Inter',sans-serif; letter-spacing:0; margin-left:5px; }
.trk-body{ display:none; padding:10px 12px 12px; }
.trk.open .trk-body{ display:block; }
.tri{ margin-left:auto; color:var(--text-dim); font-size:10px; }
.grid-scroll{ overflow-x:auto; padding-bottom:4px; }
.row{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.row .rlabel{ width:62px; font-size:10px; color:var(--text-dim); flex-shrink:0; text-align:right;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cells{ display:grid; gap:3px; }
.cell{ height:18px; min-width:16px; border:1px solid var(--border); border-radius:3px;
  background:#241d15; cursor:pointer; padding:0;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; }
@media (pointer: coarse){
  .cell{ height:30px; min-width:26px; border-radius:4px; }
  .cells{ gap:4px; }
  .row .rlabel{ font-size:11px; }
}
.cell.beat{ background:#2b2318; }
.cell.bar-start{ border-left:2px solid rgba(200,150,62,0.45); }
.cell:hover{ border-color:var(--brass); }
.cell.playing{ outline:2px solid #fff; outline-offset:-1px; }
.cell.accent{ box-shadow:inset 0 3px 0 rgba(255,255,255,0.9), 0 0 4px rgba(255,255,255,0.35); }
.cell.on-mel1{ background:#4fb0a8; border-color:#2a7a72; }
.cell.on-mel2{ background:#a87fd0; border-color:#6b4a93; }
.cell.on-sub{ background:#e8a0c8; border-color:#8f2a63; }
.cell.on-bass{ background:#c8963e; border-color:#8a6b3a; }
.cell.on-wind1{ background:#7fc98a; border-color:#2f7a44; }
.cell.on-wind2{ background:#e0805a; border-color:#94402a; }
.cell.on-kick{ background:#8f89e8; border-color:#3c3489; }
.cell.on-snare{ background:#e79576; border-color:#993c1d; }
.cell.on-hihat{ background:#5dcaa5; border-color:#0f6e56; }
.cell.on-shaker{ background:#e8d98f; border-color:#8f7f2a; }
.cell.on-openhat{ background:#7fd8c8; border-color:#1f7a6a; }
.cell.on-clap{ background:#e8a0c8; border-color:#8f2a63; }
.cell.on-tom{ background:#b48fe8; border-color:#5a2a99; }
.cell.on-crash{ background:#e8c07f; border-color:#96631a; }
.cell.on-se{ background:#f0c040; border-color:#9a7410; }
.chord-row{ display:flex; gap:4px; flex-wrap:nowrap; }
.chord-spacer{ width:68px; flex-shrink:0; }
.chord-cell{ width:74px; height:30px; border-radius:6px; border:1px solid var(--border);
  background:#241d15; color:var(--text-dim); font-family:'Oswald',sans-serif; font-size:12px;
  cursor:pointer; flex-shrink:0; }
.chord-cell.set{ background:var(--brass); color:#14100c; border-color:var(--brass); font-weight:600; }
.chord-cell.bar-start{ border-left:2px solid rgba(200,150,62,0.45); }
.chord-cell.playing{ outline:2px solid #fff; outline-offset:-1px; }
.phrase-list{ display:flex; gap:6px; flex-wrap:wrap; }
.phrase{ padding:6px 12px; border-radius:8px; cursor:pointer; font-size:12px;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); color:var(--text); }
.phrase.active{ background:var(--teal); border-color:var(--teal); color:#14100c; font-weight:700; }
.phrase .meta{ display:block; font-size:9.5px; opacity:0.8; }
.timeline{ display:flex; gap:3px; flex-wrap:wrap; align-items:center; flex:1; min-width:240px;
  background:#1a1510; border:1px solid var(--border); border-radius:8px; padding:8px; min-height:46px; }
.tl-item{ border:1px solid rgba(255,255,255,0.16); border-radius:6px; background:#241d15;
  padding:3px 7px; font-size:11px; color:var(--text); cursor:pointer; font-family:'Oswald',sans-serif; }
.tl-item.cur{ box-shadow:0 0 0 2px var(--brass); }
.tl-item .x{ margin-left:5px; color:var(--accent); }
.tl-empty{ font-size:11.5px; color:var(--text-dim); }
.mixer{ display:grid; grid-template-columns:repeat(auto-fill,minmax(176px,1fr)); gap:8px; }
.mix{ border:1px solid var(--border); border-radius:9px; padding:8px 10px; background:var(--bg-2); }
.mix .mname{ font-family:'Oswald',sans-serif; font-size:11.5px; color:var(--brass);
  letter-spacing:0.5px; margin-bottom:5px; }
.mix .mrow{ display:flex; align-items:center; gap:5px; }
.mix input[type=range]{ width:66px; }
.mix button{ padding:3px 7px; font-size:10px; border-radius:5px; cursor:pointer;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); color:var(--text-dim); }
.mix button.mute.on{ background:#5a2a2a; border-color:#a04040; color:#f0b0b0; }
.mix button.solo.on{ background:#2a4a5a; border-color:#4090a0; color:#b0e0f0; }
.song-list{ display:flex; flex-direction:column; gap:4px; width:100%; margin-top:4px; }
.song-item{ display:flex; align-items:center; gap:8px; background:#221b13; border:1px solid #3b3125;
  border-radius:6px; padding:5px 8px; }
.song-item .nm{ flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.song-item .dt{ font-size:11px; color:var(--text-dim); }
.song-item button{ font-size:11.5px; padding:3px 8px; border-radius:5px; cursor:pointer;
  background:#2e2619; border:1px solid #4a3d2a; color:var(--text); font-family:inherit; }
.song-item button.danger{ color:#e79576; }
.song-empty{ font-size:12px; color:var(--text-dim); padding:4px 2px; }
.zc-locked{ position:relative; opacity:0.45; }
.zc-locked *{ pointer-events:none !important; }
.zc-locked::after{ content:'書き出し中は変更できません'; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center; border-radius:12px;
  background:rgba(20,16,12,0.55); color:var(--brass); font-size:12.5px;
  letter-spacing:0.5px; pointer-events:none; }
.fold .fold-head{ cursor:pointer; margin-bottom:0; }
.fold .fold-head::after{ content:'▼'; margin-left:auto; color:var(--text-dim); font-size:10px; }
.fold.open .fold-head::after{ content:'▲'; }
.fold .fold-body{ display:none; padding-top:12px; }
.fold.open .fold-body{ display:block; }
.split{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:820px){ .split{ grid-template-columns:1fr; } .fx-row .t-label{ width:auto; text-align:left; } }
footer{ margin-top:20px; font-size:11.5px; color:var(--text-dim); text-align:center; line-height:1.7; }
footer b{ color:var(--brass); }
.trk-head select optgroup{ background:#1d1710; color:var(--brass); font-style:normal; font-weight:600; }
.trk-head select option{ background:#1d1710; color:var(--text); font-weight:400; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ZCnova <span>BGM Studio</span></h1>
    <div class="subtitle">曲調と長さを選ぶだけで動画用のBGMができます。音はすべてWeb Audio APIとアプリ内の音楽生成アルゴリズムでその場で生成。
      <br>既存の楽曲・BGM素材・サンプル音源は使用していないため、生成したBGMは動画・配信・SNSなどに基本的に自由に利用できます。</div>
  </header>
  <div class="transport">
    <button id="playBtn" title="再生／停止（スペースキー）">▶</button>
    <div class="now" id="nowPlaying">まだ曲がありません。下の「① 曲を作る」から曲調を選んでください。</div>
    <span class="badge" id="lenBadge">長さ —</span>
    <button class="io-btn save" id="topSaveBtn"
            title="この曲をこの端末に保存します（下の「保存した曲」に並びます）">💾 この曲を保存</button>
    <button class="io-btn" id="undoBtn" disabled>↩ やり直す</button>
    <span id="saveMark" class="save-mark"></span>
      <button class="io-btn" id="cleanupBtn" title="ZCnova内部の音声処理を整理して再初期化します">🔧 動作を安定化</button>
  </div>
  <p class="status warn" id="playHint" style="display:none; margin:-10px 0 12px;"></p>
  <div class="card" id="card1">
    <div class="card-head">
      <div class="card-title"><span class="stage-no">1</span>曲を作る<small>曲調と長さを選ぶと1曲できます</small></div>
    </div>
    <div class="fx-row">
      <span class="t-label">曲調</span>
      <div class="pat-btns" id="moodCatPick"></div>
    </div>
    <div class="fx-row" id="moodRow" style="margin-top:-4px;">
      <span class="t-label"></span>
      <div class="pat-btns" id="moodPick"></div>
    </div>
    <div class="fx-row">
      <span class="t-label">1かたまりの長さ</span>
      <div class="pat-btns" id="barsPick">
        <button class="pat-btn" data-bars="1">1小節</button>
        <button class="pat-btn active" data-bars="2">2小節</button>
        <button class="pat-btn" data-bars="4">4小節</button>
        <button class="pat-btn" data-bars="8">8小節</button>
      </div>
    </div>
    <div class="fx-row">
      <span class="t-label">演奏</span>
      <div class="pat-btns" id="playModePick"></div>
    </div>
    <div class="fx-row">
      <span class="t-label" title="曲はフレーズ単位で並べるので、ぴったりの秒数にはなりません。上のバーに実際の長さが出ます。">曲の長さ<small style="color:var(--text-dim);font-weight:400;">（目安）</small></span>
      <div class="pat-btns" id="lengthPick">
        <button class="pat-btn" data-sec="30">30秒</button>
        <button class="pat-btn" data-sec="60">1分</button>
        <button class="pat-btn active" data-sec="180">3分</button>
        <button class="pat-btn" data-sec="300">5分</button>
        <button class="pat-btn" data-sec="600">10分</button>
      </div>
    </div>
    <div class="fx-row">
      <span class="t-label">メロディ</span>
      <div class="pat-btns" id="melStylePick"></div>
    </div>
    <div class="fx-row" style="margin-top:-4px;">
      <span class="t-label"></span>
      <button class="clr-btn" id="melMoreBtn" aria-expanded="false">▸ くわしく決める</button>
      <span class="hint" style="margin:0;" id="melMoreNote">形・リズム・ひびき・終わり方を自分で組み合わせます</span>
    </div>
    <div id="melDetail" style="display:none;">
      <div id="melKnobTier1"></div>
      <div class="fx-row" style="margin-top:-4px;">
        <span class="t-label"></span>
        <button class="clr-btn" id="melMore2Btn" aria-expanded="false">▸ さらに細かく</button>
        <span class="hint" style="margin:0;">跳ぶ幅・音の長さ・くり返し方まで決めます</span>
      </div>
      <div id="melKnobTier2" style="display:none;"></div>
    </div>
    <div class="fx-row">
      <span class="t-label">曲の組み立て方</span>
      <div class="pat-btns" id="arrangePick"></div>
    </div>
    <div class="fx-row" style="margin-top:-4px;">
      <span class="t-label"></span>
      <button class="clr-btn" id="arrMoreBtn" aria-expanded="false">▸ もっと見る</button>
      <span class="hint" style="margin:0;">イントロ〜Aメロ〜サビの並べ方です</span>
    </div>
    <div class="fx-row">
      <span class="t-label">曲のゆらぎ</span>
      <div class="pat-btns" id="spreadPick"></div>
    </div>
    <div class="fx-row" style="margin-top:-4px;">
      <span class="t-label"></span>
      <span class="hint" style="margin:0;" id="spreadNote"></span>
    </div>
    <div class="fx-row">
      <span class="t-label">音数</span>
      <input type="range" id="density" min="15" max="100" value="60">
      <span class="fx-val" id="densityVal" style="min-width:110px;">ふつう（60%）</span>
      <span class="t-label" style="width:auto;">人間っぽさ</span>
      <input type="range" id="humanize" min="0" max="100" value="35">
      <span class="fx-val" id="humanizeVal">35%</span>
    </div>
    <div class="fx-row">
      <span class="t-label"></span>
      <button class="io-btn go" id="makeBtn">この設定で作る</button>
      <button class="io-btn" id="againBtn" title="曲調などの設定はそのまま、中身だけ作り直します">🎲 もう1曲つくる</button>
    </div>
    <div class="fx-row" style="margin-top:-4px;">
      <span class="t-label"></span>
      <button class="io-btn save" id="makePlayBtn"
              title="いまの曲を鳴らします。もう一度押すと止まります">▶ 聴く</button>
      <span class="hint" style="margin:0;">作ったらここで聴けます</span>
    </div>
    <div class="fx-row" style="margin-top:2px;">
      <span class="t-label"></span>
      <button class="clr-btn" id="makeHelpBtn" aria-expanded="false">▸ 使い方をみる</button>
    </div>
    <p class="hint" id="makeHelp" style="display:none;">
      曲調ごとに<b>テンポ・音階・コード進行・楽器・リズム</b>がまとめて決まります。同じ曲調でも押すたびに違う曲になります。<br>
      気に入った曲は、上のバーの<b>💾 この曲を保存</b>（この端末に残す）で残してください。
      音のファイルとして残したいときは<b>⑤ 保存・書き出し</b>から MP3／WAV で書き出せます。
      作り直す前に戻したいときは、上のバーの<b>↩ やり直す</b>で12手ぶんまで戻せます。
      <b>それより前の曲は戻せません。</b><br>
      <b>この設定で作る</b>はいまの曲のまま設定だけ反映します。
      <b>🎲 もう1曲つくる</b>は設定そのままで別の曲にします。<br>
      <b>メロディ</b>を変えると、同じコード進行でもまるで違う曲になります（いちばん効きます）。
      <b>くわしく決める</b>を開くと、形・リズム・ひびき・終わり方を自分で組み合わせられます。<br>
      <b>曲の組み立て方</b>はイントロ〜Aメロ〜Bメロ〜サビの並べ方です。どちらも「おまかせ」なら曲調に合うものが自動で選ばれます。<br>
      <b>音数</b>を下げても、1小節が薄くなりすぎないよう自動で下限を保ちます。<br>
      <b>曲の長さ</b>は目安です。曲はフレーズ単位で並べるため、ぴったりの秒数にはなりません。
      動画で使うぶんが足りなくならないよう<b>指定より少し長めに作ります</b>（実際の長さは上のバーに出ます）。
    </p>
    <div class="status" id="makeStatus"></div>
  </div>
  <div class="card fold" id="card2">

    <p class="hint" style="margin:-8px 0 10px;">

      「自動」にしておくと、間に合わなくなってきたときだけ音を軽くして、落ち着いたら戻します。
      それでも気になるときは①の<b>音数</b>を下げるか、余韻の長い音色

    <div class="mixer" id="mixer"></div>

        <div class="fx-row"><span class="t-label">全体の音量</span>
          <input type="range" id="masterVol" min="0" max="100" value="80"><span class="fx-val" id="masterVolVal">80%</span></div>
        <div class="fx-row"><span class="t-label">テンポ</span>
          <input type="range" id="bpm" min="50" max="180" value="100"><span class="fx-val" id="bpmVal">100 BPM</span></div>
        <div class="fx-row"><span class="t-label">音の明るさ</span>

      <b>つなげて繰り返す</b>を選ぶと、書き出したファイルの頭とお尻が自然につながるように作ります（動画でループさせる用）。

    </p>

      <b>プライベートウィンドウで使ったとき</b>だけです。

        <button class="io-btn" id="oneStemBtn" title="選んだパートだけをWAVで書き出します（そのパート単体の音。動画編集で重ねたいとき用）">● このパートだけ</button>
      </span>
    </div>
    <div class="fx-row">
      <span class="t-label">部分だけ</span>
      <span style="display:inline-flex;gap:5px;align-items:center;">

        <button class="io-btn" id="sectionBtn" title="選んだ部分だけを、全パート込みでWAVで書き出します">● この部分だけ</button>

      それでも<b>3分の曲でおよそ30〜60秒</b>かかります（機種と音数によって前後します）。

      音量は動画で扱いやすい大きさに自動でそろえます。書き出し中は再生を止めます（同時に動かすと不安定になるため）。<br>
      「このパートだけ」は、選んだパート（メロディ・伴奏・ドラムなど）だけをWAVで書き出します。
